<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GPSマップ</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>GPS追跡マップ</h1>

    <div id="info">

        <p id="speed">
            速度: 0 km/h
        </p>

        <p id="distance">
            移動距離: 0 m
        </p>

        <button id="followBtn">
            追従: ON
        </button>

        <button id="resetBtn">
        リセット
        </button>

    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="script.js"></script>

</body>
</html>
